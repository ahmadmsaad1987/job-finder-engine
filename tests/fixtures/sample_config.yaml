    - Ask Cognition LLP or Caravel Law about contract or secondment work.
    - Check OBA events - Construction & Infrastructure Law and Business Law sections.
    - Message two people on LinkedIn (Osgoode LLM alumni or former PCL colleagues).
    - Check the OBA and CBA job boards.
  careers_pages:
    - {name: PCL Construction, url: "https://careers.pcl.com"}
    - {name: EllisDon, url: "https://www.ellisdon.com/careers"}
    - {name: Aecon, url: "https://www.aecon.com/careers"}
    - {name: Infrastructure Ontario, url: "https://www.infrastructureontario.ca"}
    - {name: Metrolinx, url: "https://www.metrolinx.com/en/about-us/careers"}
    - {name: Ontario Power Generation, url: "https://www.opg.com/careers"}
    - {name: Hydro One, url: "https://jobs.hydroone.com"}
    - {name: Oxford Properties / OMERS, url: "https://omers.com/careers"}
    - {name: AtkinsRealis, url: "https://careers.atkinsrealis.com"}
    - {name: Arcadis, url: "https://www.arcadis.com/en-ca/careers"}
    - {name: WSP, url: "https://www.wsp.com/en-ca/careers"}
    - {name: Stantec, url: "https://www.stantec.com/en/careers"}
    - {name: Hatch, url: "https://www.hatch.com/Careers"}
    - {name: AECOM, url: "https://aecom.jobs"}
